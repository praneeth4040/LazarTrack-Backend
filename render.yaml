services:
  - type: web
    name: lazartrack-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard          # 2 vCPU / 4 GB — upgrade to pro for full 8-core zone tracker speed
    autoDeploy: true
    # Cloud Run-style: requests are handled on-demand, container scales to zero when idle
    disk:
      name: session-data
      mountPath: /app/video/output
      sizeGB: 50
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false         # Supabase project JWT secret (Settings → API → JWT Secret). Optional — JWKS/remote verification is used when unset.
      - key: SUPABASE_CLIENT_URL
        sync: false
      - key: SUPABASE_CLIENT_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false         # Server-side only: Supabase Storage uploads + matches.assets_url updates
      - key: ALLOWED_ORIGINS
        sync: false         # Comma-separated web origins allowed by CORS (defaults to lazartrack.app / lazarflow.app / localhost)
      - key: ALLOWED_ORIGIN_REGEX
        sync: false         # Optional regex for preview deployments (default: ^https://[a-z0-9-]+\.vercel\.app$)
      - key: ALLOWED_ASSET_HOSTS
        sync: false         # Host suffixes the server will fetch asset URLs from (default: .supabase.co)
      - key: VIDEO_OUTPUT_DIR
        value: /app/video/output
